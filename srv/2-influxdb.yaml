---
apiVersion: v1
kind: Secret
metadata:
  name: secret-influxdb
  namespace: feira-de-jogos
type: Opaque
data:
  influxdb-username: ZmVpcmE= # echo -n 'feira' | base64
  influxdb-password: ZmVpcmE= # echo -n 'feira' | base64
  influxdb-admin-token: ZmVpcmE= # echo -n 'feira' | base64
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-influxdb
  namespace: feira-de-jogos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "feira"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "feira"
            - name: DOCKER_INFLUXDB_INIT_USERNAME_FILE
              value: /run/secrets/influxdb-username
            - name: DOCKER_INFLUXDB_INIT_PASSWORD_FILE
              value: /run/secrets/influxdb-password
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE
              value: /run/secrets/influxdb-admin-token
          ports:
            - containerPort: 8086
          livenessProbe:
            exec:
              command: ["influx", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["influx", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-influxdb
        - name: secrets
          projected:
            sources:
              - secret:
                  name: secret-influxdb
                  items:
                    - key: influxdb-username
                      path: influxdb-username
                    - key: influxdb-password
                      path: influxdb-password
                    - key: influxdb-admin-token
                      path: influxdb-admin-token
---
apiVersion: v1
kind: Service
metadata:
  name: service-influxdb
  namespace: feira-de-jogos
spec:
  selector:
    app: influxdb
  ports:
    - port: 8086
      targetPort: 8086
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: clusterissuer-tsdb
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: etorresini@ifsc.edu.br
    privateKeySecretRef:
      name: influxdb
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: gateway-tsdb
                namespace: feira-de-jogos
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-tsdb
  namespace: feira-de-jogos
  annotations:
    cert-manager.io/cluster-issuer: "clusterissuer-tsdb"
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "tsdb.k8s.sj.ifsc.edu.br"
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate-tsdb
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: "tsdb.k8s.sj.ifsc.edu.br"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-tsdb
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: influxdb
      sectionName: https
  hostnames:
    - "tsdb.k8s.sj.ifsc.edu.br"
  rules:
    - backendRefs:
        - name: influxdb
          port: 8083
