---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-mosquitto
  namespace: feira-de-jogos
data:
  mosquitto.conf: |
    allow_anonymous true
    listener 1883
    protocol mqtt
    listener 8083
    protocol websockets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto
          ports:
            - containerPort: 1883
              name: mqtt-tcp
            - containerPort: 8083
              name: mqtt-ws
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
      volumes:
        - name: config
          configMap:
            name: configmap-mosquitto
---
apiVersion: v1
kind: Service
metadata:
  name: service-mosquitto
  namespace: feira-de-jogos
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt-ws
      port: 8083
      targetPort: 8083
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-mqtt
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-mqtt
  hostnames:
    - "mqtt.k8s.sj.ifsc.edu.br"
  rules:
    - backendRefs:
        - name: service-mosquitto
          port: 8083
