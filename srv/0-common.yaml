---
apiVersion: v1
kind: Namespace
metadata:
  name: feira-de-jogos
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: clusterissuer-feira-de-jogos
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: etorresini@ifsc.edu.br
    privateKeySecretRef:
      name: feira-de-jogos
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: gateway-feira-de-jogos
                sectionName: https-mqtt
                namespace: feira-de-jogos
              - name: gateway-feira-de-jogos
                sectionName: https-tsdb
                namespace: feira-de-jogos
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-feira-de-jogos
  namespace: feira-de-jogos
  annotations:
    cert-manager.io/cluster-issuer: "clusterissuer-feira-de-jogos"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http 
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-mqtt
      protocol: HTTPS
      port: 443
      hostname: "mqtt.k8s.sj.ifsc.edu.br"
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate-mqtt
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-tsdb
      protocol: HTTPS
      port: 443
      hostname: "tsdb.k8s.sj.ifsc.edu.br"
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate-tsdb
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-fast
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fsType: "ext4"
  dataLocality: "best-effort" 
